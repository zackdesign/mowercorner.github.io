# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole site, values
# which you are expected to set up once and rarely edit after that.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, restart the server.

# Site settings
title: "Mower Corner"
tagline: "Outdoor power equipment sales, service & spare parts in Colac"
email: parts@mowercorner.com.au
phone: "03 5231 6466"
phone_intl: "+61 3 5231 6466"
description: >
  Mower Corner is Colac's Elite STIHL Dealer and outdoor power equipment
  specialist, locally owned and run for well over 30 years. Sales, servicing,
  repairs and spare parts for lawn mowers, ride-on and zero-turn mowers,
  chainsaws, brush cutters, whipper snippers, blowers and hedge trimmers,
  with pickup and delivery across the Western District. Authorised dealer
  for STIHL, Toro, Victa, Cub Cadet and more.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://mowercorner.com.au" # the base hostname & protocol for your site

# Location
address: "14 Skene Street, Colac, VIC 3250"
street_address: "14 Skene Street"
locality: "Colac"
region: "VIC"
postcode: "3250"
latitude: -38.338381
longitude: 143.581248
maps_url: "https://maps.google.com/?q=14+Skene+St+Colac+VIC+3250"

# Opening hours. `open`/`close` are 24h local (Australia/Melbourne) and drive
# the schema.org markup, the printed hours, and the live open/closed indicator.
timezone_name: "Australia/Melbourne"
hours:
  - days: "Monday – Friday"
    open: "08:30"
    close: "17:00"
    display: "8:30am – 5pm"
    weekdays: [1, 2, 3, 4, 5]
    schema: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
  - days: "Saturday"
    open: "09:00"
    close: "12:00"
    display: "9am – 12pm"
    weekdays: [6]
    schema: ["Saturday"]
  - days: "Sunday"
    closed: true
    display: "Closed"
    weekdays: [0]

# Social media
facebook_username: mower.corner

# Analytics (GA4) — only emitted on production builds, see _includes/analytics.html
google_analytics: "G-WTDYR4J7RM"

# SEO and accessibility settings
lang: en-AU
author: Mower Corner
logo: /assets/icon-512.png
social:
  name: Mower Corner
  links:
    - https://www.facebook.com/mower.corner/

# Social preview image (jekyll-seo-tag og:image / twitter:image on every page)
defaults:
  - scope: { path: "" }
    values:
      image: "https://res.cloudinary.com/dux48uumi/image/upload/w_1200,h_630,c_fill,g_auto/e_improve:outdoor:50/e_auto_color/e_vibrance:50/e_saturation:15/q_auto/v1500944801/mowercorner%20slideshow/DSCF6504.jpg"

# Imagery (Cloudinary).
cloudinary_base: "https://res.cloudinary.com/dux48uumi/image/upload"

# Colour grade applied to every photo. The 2017 shop photography is flat and
# underexposed, so the correction happens server-side at Cloudinary rather than
# with CSS filters — auto white balance and vibrance need the actual pixels.
#   e_improve:outdoor  auto exposure/contrast tuned for daylight scenes
#   e_auto_color       white balance, which kills the grey cast
#   e_vibrance         lifts muted colour without blowing out the already-saturated
#   e_saturation       a small global top-up
#   e_sharpen          recovers detail lost to the original soft focus
photo_fx: "e_improve:outdoor:50/e_auto_color/e_vibrance:50/e_saturation:15/e_sharpen:70"
hero_image: "v1500944801/mowercorner%20slideshow/DSCF6504.jpg"
workshop_images:
  - path: "v1500944801/mowercorner%20slideshow/DSCF6513.jpg"
    alt: "The STIHL chainsaw and accessory wall at Mower Corner"
  - path: "v1500944801/mowercorner%20slideshow/DSCF6510.jpg"
    alt: "The Mower Corner shopfront on Skene Street, Colac"
  - path: "v1500944801/mowercorner%20slideshow/DSCF6531.jpg"
    alt: "A Mower Corner staff member with the pickup and delivery ute"

# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
