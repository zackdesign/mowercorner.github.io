{%- comment -%}
Service + BreadcrumbList for each service page, and FAQPage when the page
defines a `faq:` list in its front matter. The provider is the same
LocalBusiness node the homepage declares, referenced by @id.
{%- endcomment -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Service",
      "name": {{ page.service_name | default: page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "serviceType": {{ page.service_type | default: page.title | jsonify }},
      "url": "{{ site.url }}{{ page.url }}",
      "provider": { "@id": "{{ site.url }}/#business" },
      "areaServed": [
        { "@type": "City", "name": "Colac" },
        { "@type": "AdministrativeArea", "name": "Western District, Victoria" }
      ],
      "availableChannel": {
        "@type": "ServiceChannel",
        "servicePhone": { "@type": "ContactPoint", "telephone": "{{ site.phone_intl }}" },
        "serviceLocation": { "@id": "{{ site.url }}/#business" }
      }
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Mower Corner", "item": "{{ site.url }}/" },
        { "@type": "ListItem", "position": 2, "name": {{ page.crumb | default: page.title | jsonify }}, "item": "{{ site.url }}{{ page.url }}" }
      ]
    }{% if page.faq %},
    {
      "@type": "FAQPage",
      "mainEntity": [
        {%- for item in page.faq %}
        {
          "@type": "Question",
          "name": {{ item.q | jsonify }},
          "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | jsonify }} }
        }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ]
    }{% endif %}
  ]
}
</script>
